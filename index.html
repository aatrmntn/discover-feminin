const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function go(next) {
  Object.assign(st, next);

  document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches ? document.startViewTransition(draw) : draw();
}

function progress(n) {

    <div class="bars" aria-hidden="true">${[1, 2, 3].map(i => `<span class="${i <= n ? "on" : ""}"></span>`).join("")}</div>

}

function score(text, q) {
  const t = norm(text), words = norm(q).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return 0;
  let s = 0;
  for (const w of words) { if (t.split(/[\s,·-]+/).some(x => x.startsWith(w))) s += 2; else if (w.length > 2 && t.includes(w)) s += 1; else return 0; }
  return s;
}
function hl(label, q) {
  const words = norm(q).split(/\s+/).filter(w => w.length > 1);
  const n = norm(label); let out = "", i = 0;
  const marks = [];
  for (const w of words) { const j = n.indexOf(w); if (j >= 0) marks.push([j, j + w.length]); }
  marks.sort((a, b) => a[0] - b[0]);
  for (const [a, b] of marks) { if (a < i) continue; out += esc(label.slice(i, a)) + "<mark>" + esc(label.slice(a, b)) + "</mark>"; i = b; }
  return out + esc(label.slice(i));
}
function suggestions(q) {
  const c = CONCERNS.map(x => ({ x, s: score(x.l, q) * 2 + score(x.k, q) })).filter(r => r.s).sort((a, b) => b.s - a.s).slice(0, 5)
    .map(r => ({ kind: "concern", id: r.x.id, label: r.x.l, sub: r.x.g }));
  const sv = Object.entries(SERVICES).map(([id, x]) => ({ id, x, s: score(x.t + " " + x.f + " " + CONCERNS.filter(c => c.s[0] === id).map(c => c.l + " " + c.k).join(" "), q) })).filter(r => r.s).sort((a, b) => b.s - a.s).slice(0, 4)
    .map(r => ({ kind: "service", id: r.id, label: r.x.t, sub: r.x.f }));
  const people = [];
  Object.entries(SERVICES).forEach(([id, x]) => x.w.split(" · ").forEach(n => { if (n.startsWith("Unsere") || !/[A-Z]/.test(n[0])) return; const name = n.split(",")[0]; if (score(name, q) && !people.some(p => p.label === name)) people.push({ kind: "service", id, label: name, sub: x.t }); }));
  return [["Anliegen", c], ["Angebote", sv], ["Menschen", people.slice(0, 3)]].filter(g => g[1].length);
}
function urgentFor(text) { const n = norm(text); const u = URGENT.find(u => u.re.test(n)); return u ? u.msg : null; }
function urgentBox(msg) { return msg ? `<div class="urgent" role="alert">${icon("alert")}<p>${msg}</p></div>` : ""; }

function bindStart() {
  const q = $("#q"), sg = $("#sg"), clr = $("#qclear");
  let items = [], active = -1;
  const close = () => { sg.hidden = true; q.setAttribute("aria-expanded", "false"); active = -1; };
  const pickItem = it => it.kind === "concern" ? go({ step: "result", concerns: [it.id], phase: null, billing: null, focus: null })
    : go({ step: "result", focus: it.id, concerns: [], phase: null, billing: null });
  const paint = () => {
    const v = q.value.trim(); st.query = q.value; clr.hidden = !v;
    $("#urgentSlot").innerHTML = urgentBox(urgentFor(v));
    if (v.length < 2) return close();
    const groups = suggestions(v); items = groups.flatMap(g => g[1]); active = items.length ? 0 : -1;
    let n = 0;
    sg.innerHTML = groups.length ? groups.map(([h, list]) => `<div class="sgroup" role="group" aria-label="${h}"><h3>${h}</h3>${list.map(it => `<div class="sopt" role="option" id="o${n}" data-n="${n++}" aria-selected="false"><span>${hl(it.label, v)}</span><span class="sub">${esc(it.sub)}</span></div>`).join("")}</div>`).join("")
      : `<div class="snone">Dazu finden wir nichts Passendes. Versuchen Sie ein anderes Wort, gehen Sie Schritt für Schritt vor oder rufen Sie uns an: <a href="tel:${TEL}">+43 1 394 01 08</a>.</div>`;
    sg.hidden = false; q.setAttribute("aria-expanded", "true"); mark();
  };
  const mark = () => { sg.querySelectorAll(".sopt").forEach(o => o.setAttribute("aria-selected", +o.dataset.n === active)); if (active >= 0) { q.setAttribute("aria-activedescendant", "o" + active); $("#o" + active)?.scrollIntoView({ block: "nearest" }); } };
  q.addEventListener("input", paint);
  q.addEventListener("focus", () => q.value.trim().length > 1 && paint());
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && items.length) { e.preventDefault(); active = (active + 1) % items.length; mark(); }
    else if (e.key === "ArrowUp" && items.length) { e.preventDefault(); active = (active - 1 + items.length) % items.length; mark(); }
    else if (e.key === "Enter" && active >= 0 && !sg.hidden) { e.preventDefault(); pickItem(items[active]); }
    else if (e.key === "Escape") close();
  });
  sg.addEventListener("mousedown", e => { const o = e.target.closest(".sopt"); if (o) { e.preventDefault(); pickItem(items[+o.dataset.n]); } });
  clr.addEventListener("click", () => { q.value = ""; paint(); q.focus(); });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) close(); }, { once: false });
  if (st.query) paint();
}

/* ---------- result ---------- */
function rank() {
  if (st.focus) return [st.focus, ...relatedTo(st.focus)];
  const pool = st.concerns.length ? st.concerns : CONCERNS.filter(c => c.p.includes(st.phase)).map(c => c.id);
  const sc = {};
  pool.forEach(cid => byId(CONCERNS, cid).s.forEach((sid, i) => { sc[sid] = (sc[sid] || 0) + (st.concerns.length ? 3 : 1) - i * 0.5; }));
  return Object.entries(sc).sort((a, b) => b[1] - a[1]).map(e => e[0]);
}
function relatedTo(sid) { return [...new Set(CONCERNS.filter(c => c.s.includes(sid)).flatMap(c => c.s))].filter(x => x !== sid); }
function reasons(sid) { return st.concerns.map(id => byId(CONCERNS, id)).filter(c => c.s.includes(sid)).map(c => c.l); }
function billingText(s) {
  const wahl = "Als Wahlarzt-Leistung: Wir leiten Ihre Honorarnote an Ihre Kasse weiter, Sie bekommen einen Teil zurück.";
  if (s.gyn && st.billing === "kasse") return "Mit Kasse möglich bei Dr. Patrik Horak, für Patient:innen aller Kassen.";
  if (s.gyn) return "Mit Kasse bei Dr. Patrik Horak. Bei allen anderen Frauenärzt:innen als Wahlarzt-Leistung mit Rückerstattung durch Ihre Kasse.";
  return st.billing === "kasse" ? "Hier nur als Wahlarzt-Leistung. Wir leiten Ihre Honorarnote an Ihre Kasse weiter, Sie bekommen einen Teil zurück." : wahl;
}
function mailFor(s) {
  const lines = ["Guten Tag,", "", `ich möchte einen Termin anfragen: ${s.t}.`];
  if (st.phase) lines.push(`Lebensphase: ${byId(PHASES, st.phase).t}`);
  if (st.concerns.length) lines.push(`Was mich beschäftigt: ${st.concerns.map(id => byId(CONCERNS, id).l).join(", ")}`);
  if (st.billing) lines.push(`Abrechnung: ${byId(BILLING, st.billing).t}`);
  lines.push("", "Name:", "Telefon:", "Wann passt es mir gut:", "", "Vielen Dank!");
  return `mailto:${MAIL}?subject=${encodeURIComponent("Terminanfrage: " + s.t)}&body=${encodeURIComponent(lines.join("\n"))}`;
}
function viewResult() {

  const crisis = st.concerns.some(id => byId(CONCERNS, id).crisis);
  const why = reasons(ids[0]);
  return `<section class="step">
    <button class="back" data-back>${icon("left")}Zurück</button>
    <h1 class="q" style="margin-top:1rem">Das passt zu Ihnen</h1>

    ${crisis ? urgentBox(`Wenn es gerade sehr schwer ist: Die <a href="tel:142">Telefonseelsorge unter 142</a> ist rund um die Uhr erreichbar. Im Notfall <a href="tel:144">144</a>.`) : ""}

    </article>
    ${rest.length ? `<section class="also"><h2>Das könnte auch passen</h2><ul>${rest.map(id => { const s = SERVICES[id]; const r = reasons(id); return `<li class="alt"><h3>${s.t}</h3><p>${r.length ? "Passt zu: " + r.join(", ") : s.d}</p><a class="btn" href="${mailFor(s)}">Anfragen</a></li>`; }).join("")}</ul></section>` : ""}
    <div class="restart"><button class="link" data-reset>Neu beginnen</button><button class="link" data-go="phase">Fragen noch einmal beantworten</button></div>
    <p class="note">Montag 7 bis 19 Uhr, Dienstag bis Donnerstag 8 bis 19 Uhr, Freitag 7 bis 14 Uhr · Nusswaldgasse 5, 1190 Wien. Diese Orientierung ersetzt keine ärztliche Beratung. Bitte sagen Sie Termine spätestens 24 Stunden vorher ab, sonst können 100 € Ausfallhonorar anfallen.</p>

/* ---------- routing ---------- */
const trail = [];
function render() {
  const v = { start: viewStart, phase: viewPhase, concerns: viewConcerns, billing: viewBilling, result: viewResult }[st.step];
  app.innerHTML = v();
  document.title = { start: "Was beschäftigt Sie?", phase: "Ihre Lebensphase", concerns: "Ihr Anliegen", billing: "Abrechnung", result: "Ihre Empfehlung" }[st.step] + " · feminin";
  if (st.step === "start") bindStart();
  const h = app.querySelector("h1"); if (h && st.step !== "start") { h.tabIndex = -1; h.focus({ preventScroll: true }); }
}
app.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const prev = st.step;
  if (t.dataset.back !== undefined) { const back = trail.pop() || "start"; return go({ step: back }); }
  if (t.dataset.reset !== undefined) { trail.length = 0; return go({ step: "start", phase: null, concerns: [], billing: null, focus: null, query: "" }); }
  if (t.dataset.concern) { trail.push(prev); return go({ step: "result", concerns: [t.dataset.concern], phase: null, billing: null, focus: null }); }
  if (t.dataset.phase) { trail.push(prev); const keep = st.phase === t.dataset.phase ? st.concerns : []; return go({ step: "concerns", phase: t.dataset.phase, concerns: keep, focus: null }); }
  if (t.dataset.toggle) { const id = t.dataset.toggle; st.concerns = st.concerns.includes(id) ? st.concerns.filter(x => x !== id) : [...st.concerns, id]; const y = scrollY; render(); scrollTo(0, y); app.querySelector(`[data-toggle="${id}"]`)?.focus(); return; }
  if (t.dataset.billing) { trail.push(prev); return go({ step: "result", billing: t.dataset.billing }); }
  if (t.dataset.go) { if (t.dataset.go !== prev) trail.push(prev); return go({ step: t.dataset.go, focus: t.dataset.go === "phase" ? null : st.focus }); }
});
render();
</script>
</body>
